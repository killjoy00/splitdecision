name: Refresh playtest report

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/playtest-report.yml'
      - 'scripts/playtest-sync-lib.mjs'
      - 'scripts/sync-playtest-report.mjs'
      - 'scripts/playtest-report-lib.mjs'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splitdecision-playtest-report
  cancel-in-progress: false

jobs:
  refresh-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull privacy-safe playtest telemetry and rebuild report
        run: node scripts/sync-playtest-report.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYTEST_LOOKBACK_HOURS: '72'
          PLAYTEST_MIN_HUMANS: '2'

      - name: Commit report when new telemetry arrives
        run: |
          if git diff --quiet -- docs/PLAYTEST_REPORT.md data/telemetry-summaries.json && \
             [ -z "$(git status --porcelain -- docs/PLAYTEST_REPORT.md data/telemetry-summaries.json)" ]; then
            echo "No new playtest telemetry."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAYTEST_REPORT.md data/telemetry-summaries.json
          git commit -m "Update automated playtest report"
          git push
