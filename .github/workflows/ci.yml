name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test rules engine
        run: npm test
      - name: Build web shell
        run: npm run build
      - name: Run deterministic simulation smoke test
        run: npm run simulate -- --games 1000 --seed ci
