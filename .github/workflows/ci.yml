name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test rules engine
        run: npm test
      - name: Build web shell
        run: npm run build
      - name: Install Chromium for mobile browser tests
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: npm run test:e2e
      - name: Type-check and bundle remote service
        run: npm run build:remote
      - name: Run deterministic simulation smoke test
        run: npm run simulate -- --games 1000 --seed ci
