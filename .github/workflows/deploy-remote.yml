name: Deploy remote play service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: remote-production
      url: https://api.splitdecision.planitnow.us
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test engine and remote rooms
        run: npm test
      - name: Build web app and remote service
        run: npm run build && npm run build:remote
      - name: Deploy Worker and Durable Object
        run: npm run deploy:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
